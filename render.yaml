services:
  - type: web
    runtime: static
    name: erdeko-hali
    buildCommand: echo "Derleme gerekmiyor"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
